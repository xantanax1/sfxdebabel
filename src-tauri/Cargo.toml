[package]
name = "sfx-de-babel"
version = "0.1.0"
description = "Desktop SFX search, envelope matching and instant WAV drag-and-drop utility"
authors = ["xantanax1"]
license = "MIT"
repository = "https://github.com/xantanax1/sfxdebabel"
edition = "2021"

[lib]
name = "sfx_de_babel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-drag = "2.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "adpcm", "flac"] }
rodio = { version = "0.20", default-features = false }
hound = "3.5"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
bytes = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
urlencoding = "2.1"
tauri-plugin-dialog = "2"
